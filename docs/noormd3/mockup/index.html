<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoorMD 3.0 mock-up</title>
<style>
/* ---------- the nine themes (colours from NoorMD 2.0's themes.css) ---------- */
:root, [data-theme=dark] { --bg:#0b0d12; --panel:#11151d; --surface:#181e29; --surface2:#212837; --border:#2a3240; --text:#e9edf5; --muted:#8996aa; --accent:#b19aff; --accent2:#7f66db; --on-accent:#211835; }
[data-theme=light] { --bg:#f3f5f9; --panel:#ffffff; --surface:#f7f8fb; --surface2:#e9edf4; --border:#dae0e9; --text:#202838; --muted:#5f6b80; --accent:#6a4ed0; --accent2:#6145c1; --on-accent:#ffffff; }
[data-theme=nocturne] { --bg:#070b14; --panel:#0c1220; --surface:#121a2c; --surface2:#1a2438; --border:#223049; --text:#e4ecf7; --muted:#8a9bb5; --accent:#5fd4e6; --accent2:#2fa8bd; --on-accent:#04161b; }
[data-theme=ember] { --bg:#0f0c0a; --panel:#16120f; --surface:#201a15; --surface2:#2a221b; --border:#3a2f25; --text:#f2e9e1; --muted:#a8978a; --accent:#f2a65a; --accent2:#d17f2f; --on-accent:#241404; }
[data-theme=evergreen] { --bg:#080f0c; --panel:#0d1612; --surface:#14201a; --surface2:#1b2a22; --border:#26382e; --text:#e3efe8; --muted:#8ea89a; --accent:#6fd6a0; --accent2:#3fae78; --on-accent:#05180e; }
[data-theme=rosewood] { --bg:#120a0f; --panel:#191017; --surface:#23171f; --surface2:#2e1f29; --border:#3d2a37; --text:#f3e6ee; --muted:#ae94a5; --accent:#f08bb4; --accent2:#c95f8c; --on-accent:#2a0b19; }
[data-theme=parchment] { --bg:#f1eadd; --panel:#fbf7ef; --surface:#f5efe3; --surface2:#ebe2d1; --border:#ddd1bc; --text:#2c241b; --muted:#6b5d4c; --accent:#9a4a1c; --accent2:#7d3a12; --on-accent:#ffffff; }
[data-theme=glacier] { --bg:#eef3f8; --panel:#ffffff; --surface:#f5f8fb; --surface2:#e4ecf4; --border:#d3dee9; --text:#15233a; --muted:#526581; --accent:#1f63c6; --accent2:#1752a8; --on-accent:#ffffff; }
[data-theme=contrast] { --bg:#000000; --panel:#000000; --surface:#0d0d0d; --surface2:#1a1a1a; --border:#8c8c8c; --text:#ffffff; --muted:#d0d0d0; --accent:#ffd84a; --accent2:#ffc400; --on-accent:#000000; }

/* ---------- tokens: the same for every direction; directions change shape, not colour ---------- */
:root { --sel: color-mix(in srgb, var(--accent) 22%, transparent); --hover: color-mix(in srgb, var(--text) 7%, transparent);
  --r1: 4px; --r2: 8px; --r3: 12px; --gap: 6px; --ctl: 28px; --pad: 10px; --font: 13px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: var(--font)/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.app { display: grid; grid-template-rows: 38px auto 1fr 26px; height: 100vh; }

/* title bar */
.titlebar { display: flex; align-items: center; gap: 4px; padding-left: 10px; background: var(--bg); user-select: none; }
.logo { width: 20px; height: 20px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; color: var(--on-accent); font-weight: 800; font-size: 12px; margin-right: 6px; }
.mainmenu button { padding: 4px 9px; border-radius: var(--r1); color: var(--text); opacity: .85; }
.mainmenu button:hover, .mainmenu button.open { background: var(--hover); opacity: 1; }
.wintitle { flex: 1; text-align: center; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wintitle b { color: var(--text); font-weight: 600; }
.nowplaying { display: flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--surface); color: var(--muted); font-size: 12px; margin-right: 8px; }
.nowplaying i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.winbtns { display: flex; align-self: stretch; }
.winbtns button { width: 46px; font-size: 13px; color: var(--muted); }
.winbtns button:hover { background: var(--hover); color: var(--text); }
.winbtns button.close:hover { background: #c42b1c; color: #fff; }

/* bench tabs */
.benchtabs { display: flex; align-items: flex-end; gap: 2px; padding: 0 8px; background: var(--bg); border-bottom: 1px solid var(--border); }
.btab { display: flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: var(--r2) var(--r2) 0 0; color: var(--muted); position: relative; }
.btab:hover { color: var(--text); background: var(--hover); }
.btab.active { color: var(--text); background: var(--panel); box-shadow: inset 0 2px 0 var(--accent); }
.btab .ic { font-size: 14px; }
.btab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.btab .x { opacity: 0; font-size: 11px; margin-left: 2px; }
.btab:hover .x, .btab.active .x { opacity: .6; }
.btab.add { padding: 7px 11px; }

/* the bench area */
.bench { display: grid; grid-template-columns: var(--lw, 240px) 1fr var(--rw, 260px); grid-template-rows: 1fr var(--bh, 0px); gap: var(--gap); padding: var(--gap); background: var(--bg); min-height: 0; }
.dock { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; min-width: 0; border-radius: var(--r3); }
.dock.left { grid-row: 1 / 3; } .dock.right { grid-row: 1 / 3; grid-column: 3; } .dock.bottom { grid-column: 2; grid-row: 2; }
.dock.drop { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--sel); }
.dock:empty { border: 1px dashed transparent; }
.center { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border-radius: var(--r3); border: 1px solid var(--border); overflow: hidden; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r3); display: flex; flex-direction: column; min-height: 0; flex: 1; overflow: hidden; }
.phead { display: flex; align-items: center; gap: 2px; padding: 4px; border-bottom: 1px solid var(--border); }
.ptab { display: flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: var(--r2); color: var(--muted); cursor: grab; font-size: 12px; }
.ptab.active { background: var(--sel); color: var(--text); }
.ptab:hover { color: var(--text); }
.phead .sp { flex: 1; }
.iconbtn { width: var(--ctl); height: var(--ctl); border-radius: var(--r2); color: var(--muted); display: grid; place-items: center; }
.iconbtn:hover { background: var(--hover); color: var(--text); }
.pbody { padding: var(--pad); overflow: auto; flex: 1; min-height: 0; }
.doctabs { display: flex; gap: 2px; padding: 4px 6px 0; border-bottom: 1px solid var(--border); background: var(--surface); }
.dtab { padding: 6px 12px; border-radius: var(--r2) var(--r2) 0 0; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.dtab.active { background: var(--panel); color: var(--text); }
.dtab .dirty { color: var(--accent); }
.content { flex: 1; overflow: auto; min-height: 0; }

/* status bar */
.statusbar { display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--bg); border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
.statusbar .sp { flex: 1; }
.statusbar button { color: var(--muted); display: flex; align-items: center; gap: 6px; }
.statusbar button:hover { color: var(--text); }
.job { display: flex; align-items: center; gap: 6px; }
.job span { width: 60px; height: 4px; border-radius: 2px; background: var(--surface2); overflow: hidden; }
.job span::after { content: ""; display: block; width: 62%; height: 100%; background: var(--accent); }

/* lists, rows, fields */
.row { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: var(--r1); color: var(--text); cursor: default; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); }
.row .m { color: var(--muted); margin-left: auto; font-size: 12px; }
.indent1 { padding-left: 22px; } .indent2 { padding-left: 36px; }
.h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 8px 4px; }
.h:first-child { margin-top: 2px; }
.field { display: flex; align-items: center; height: var(--ctl); padding: 0 10px; border-radius: var(--r2); background: var(--surface); border: 1px solid var(--border); color: var(--muted); gap: 8px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--surface2); color: var(--muted); font-size: 12px; margin: 2px; }
.btn { height: var(--ctl); padding: 0 12px; border-radius: var(--r2); background: var(--surface2); border: 1px solid var(--border); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }

/* bench contents */
.doc { max-width: 760px; margin: 0 auto; padding: 32px 40px 80px; }
.doc h1 { font-size: 28px; margin: 0 0 6px; } .doc h2 { font-size: 19px; margin: 26px 0 8px; } .doc p, .doc li { color: color-mix(in srgb, var(--text) 88%, var(--muted)); }
.doc .meta { color: var(--muted); font-size: 12px; } .doc a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
.doc code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
table.lib { width: 100%; border-collapse: collapse; }
table.lib th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); }
table.lib td { padding: 7px 12px; border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }
table.lib tr:hover td { background: var(--hover); } table.lib tr.playing td { color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 16px; }
.thumb { aspect-ratio: 4/3; border-radius: var(--r2); border: 2px solid transparent; position: relative; overflow: hidden; }
.thumb.sel { border-color: var(--accent); }
.thumb small { position: absolute; left: 8px; bottom: 6px; color: #fff; text-shadow: 0 1px 3px #000; font-size: 11px; }
.code { font: 13px/1.6 "Cascadia Code", Consolas, monospace; padding: 12px 0; counter-reset: ln; white-space: pre; }
.code div { padding-left: 64px; position: relative; } .code div::before { counter-increment: ln; content: counter(ln); position: absolute; left: 0; width: 44px; text-align: right; color: var(--muted); opacity: .6; }
.k { color: var(--accent); } .s { color: #9ece6a; } .c { color: var(--muted); font-style: italic; } .n { color: #e0af68; } .f { color: #7aa2f7; }
[data-theme=light] .s, [data-theme=glacier] .s, [data-theme=parchment] .s { color: #2e7d32; } [data-theme=light] .n, [data-theme=glacier] .n, [data-theme=parchment] .n { color: #b26a00; } [data-theme=light] .f, [data-theme=glacier] .f, [data-theme=parchment] .f { color: #1f5fbf; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border-top: 1px solid var(--border); }
.cal div { background: var(--panel); min-height: 92px; padding: 6px 8px; font-size: 12px; color: var(--muted); }
.cal div.day b { color: var(--text); font-weight: 500; } .cal div.today b { background: var(--accent); color: var(--on-accent); border-radius: 99px; padding: 0 6px; }
.ev { display: block; margin-top: 4px; padding: 2px 6px; border-radius: 4px; background: var(--sel); color: var(--text); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--border); background: var(--surface); }
.cover { width: 48px; height: 48px; border-radius: var(--r2); background: linear-gradient(135deg, var(--accent2), #ff7eb3); }
.bar { flex: 1; height: 4px; border-radius: 2px; background: var(--surface2); } .bar::after { content: ""; display: block; width: 38%; height: 100%; border-radius: 2px; background: var(--accent); }
.video { margin: 16px; aspect-ratio: 16/9; border-radius: var(--r3); background: radial-gradient(circle at 30% 40%, #3a6ea5, #0b1a2c 70%); display: grid; place-items: center; color: #fff; font-size: 48px; }
.station { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--r2); }
.station:hover { background: var(--hover); } .station.on { background: var(--sel); }
.station i { width: 40px; height: 40px; border-radius: var(--r2); display: block; }

/* menus, palette, floating */
.menu { position: fixed; z-index: 50; min-width: 240px; padding: 5px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r2); box-shadow: 0 12px 32px rgba(0,0,0,.35); }
.menu .mi { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: var(--r1); }
.menu .mi:hover { background: var(--sel); } .menu .mi kbd { margin-left: auto; color: var(--muted); font: 11px inherit; }
.menu .mi.off { color: var(--muted); opacity: .6; } .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 6px; }
.menu .mh { padding: 4px 10px 2px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.palette { position: fixed; z-index: 60; left: 50%; top: 70px; transform: translateX(-50%); width: 560px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r3); box-shadow: 0 20px 50px rgba(0,0,0,.45); overflow: hidden; }
.palette input { width: 100%; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--text); font: 15px inherit; outline: none; }
.palette .list { max-height: 320px; overflow: auto; padding: 4px; }
.float { position: fixed; z-index: 40; width: 320px; height: 300px; background: var(--panel); border: 1px solid var(--accent); border-radius: var(--r3); box-shadow: 0 18px 40px rgba(0,0,0,.45); display: flex; flex-direction: column; overflow: hidden; }
.float .fbar { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; background: var(--surface); cursor: move; font-size: 12px; color: var(--muted); }
.float .fbar b { color: var(--text); font-weight: 600; flex: 1; }
.toast { position: fixed; z-index: 70; right: 16px; bottom: 40px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--r2); box-shadow: 0 10px 30px rgba(0,0,0,.35); max-width: 360px; }

.sendstrip { position: fixed; z-index: 45; left: 8px; right: 8px; bottom: 34px; display: flex; gap: 10px; align-items: center; padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r3); box-shadow: 0 -10px 40px rgba(0,0,0,.35); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(20px); opacity: 0; } }
.sendstrip .sthing { display: flex; align-items: center; gap: 12px; padding-right: 8px; }
.scard { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 150px; padding: 10px; border-radius: var(--r2); border: 1px solid var(--border); background: var(--surface); }
.scard small { color: var(--muted); font-size: 11px; } .scard:hover, .scard.sel { border-color: var(--accent); background: var(--sel); } .scard.later { opacity: .5; }
.homegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.homecard { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; border-radius: var(--r2); border: 1px solid var(--border); background: var(--surface); text-align: left; }
.homecard:hover { border-color: var(--accent); background: var(--sel); } .homecard small { color: var(--muted); }
.menurow { display: flex; align-items: center; padding: 0 8px; background: var(--bg); }
.menurow button { padding: 4px 9px; border-radius: var(--r1); } .menurow button:hover, .menurow button.open { background: var(--hover); }
/* mock-up controls */
.mockctl { white-space: nowrap; position: fixed; z-index: 80; left: 50%; bottom: 36px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 6px 8px 6px 14px; border-radius: 99px; background: color-mix(in srgb, var(--surface2) 92%, transparent); border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,.35); font-size: 12px; color: var(--muted); backdrop-filter: blur(6px); }
.mockctl select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 99px; padding: 3px 8px; font: inherit; }
.mockctl button { padding: 3px 9px; border-radius: 99px; } .mockctl button:hover { background: var(--hover); color: var(--text); }

/* ---------- direction A: cards (inspired by the NoorEditor concept art) ---------- */
body.dirA { --gap: 6px; --r3: 12px; }
/* ---------- direction B: flat and dense (pro-tool) ---------- */
body.dirB { --gap: 0px; --r3: 0px; --r2: 4px; --pad: 8px; --ctl: 24px; --font: 12.5px; }
body.dirB .bench { padding: 0; } body.dirB .panel, body.dirB .center { border: 0; border-right: 1px solid var(--border); }
body.dirB .dock.right .panel { border-right: 0; border-left: 1px solid var(--border); }
body.dirB .dock .panel + .panel { border-top: 1px solid var(--border); }
body.dirB .btab { border-radius: 0; padding: 6px 12px; } body.dirB .btab.active { box-shadow: inset 0 -2px 0 var(--accent); background: var(--panel); }
body.dirB .phead { background: var(--surface); padding: 2px; }
body.dirB .dock.left { background: var(--panel); }
/* ---------- direction C: roomy, writing-first ---------- */
body.dirC { --gap: 14px; --r3: 16px; --pad: 16px; --ctl: 32px; --font: 14px; }
body.dirC .app { grid-template-rows: 44px auto 1fr 28px; }
body.dirC .bench { padding: 4px 14px 14px; }
body.dirC .benchtabs { border-bottom: 0; padding: 4px 14px 6px; gap: 6px; }
body.dirC .btab { border-radius: 99px; padding: 6px 16px; } body.dirC .btab.active { box-shadow: none; background: var(--sel); }
body.dirC .panel, body.dirC .center { border: 0; box-shadow: 0 1px 0 var(--border), 0 8px 24px rgba(0,0,0,.12); }
body.dirC .phead { border-bottom: 0; padding: 8px 8px 0; }
body.dirC .doctabs { background: var(--panel); padding: 8px 10px 0; }
</style>
</head>
<body class="dirC" data-theme="dark">
<div class="app">
  <header class="titlebar">
    <div class="logo" id="logo" title="Home (Ctrl+Shift+H) · About" style="cursor:pointer">N</div>
    <nav class="mainmenu" id="mainmenu"></nav>
    <div class="wintitle" id="wintitle"></div>
    <div class="nowplaying" id="nowplaying" title="Playing in Music: click for the mini player"><i></i><span>Nordic Pines — Lumen</span></div>
    <div class="winbtns"><button title="Minimise">—</button><button title="Maximise (hover: snap layouts)">▢</button><button class="close" title="Close">✕</button></div>
  </header>
  <nav class="benchtabs" id="benchtabs"></nav>
  <main class="bench" id="bench">
    <section class="dock left" data-dock="left"></section>
    <section class="center" id="center"></section>
    <section class="dock right" data-dock="right"></section>
    <section class="dock bottom" data-dock="bottom"></section>
  </main>
  <footer class="statusbar">
    <span id="benchstatus"></span><span class="sp"></span>
    <span class="job" title="A background job (with progress and Cancel)">⟳ Indexing Music <span></span></span>
    <button id="mini" title="The mini player: keeps playing whichever bench you're in">▶︎ <span>Nordic Pines · 1:12 / 3:40</span></button>
    <button title="Notifications">🔔 2</button>
  </footer>
</div>

<div class="mockctl">
  <span>Mock-up</span>
  <select id="dir" title="Layout direction">
    <option value="auto">Per bench (decided: Code compact, the rest roomy)</option>
    <option value="dirA">A · Cards (concept-art inspired)</option>
    <option value="dirB">B · Flat and dense</option>
    <option value="dirC">C · Roomy, writing first</option>
  </select>
  <select id="theme" title="Theme">
    <option>dark</option><option>light</option><option>nocturne</option><option>ember</option><option>evergreen</option><option>rosewood</option><option>parchment</option><option>glacier</option><option>contrast</option>
  </select>
  <select id="menupos" title="Where the main menu goes (a setting)"><option value="title">Menu in the title bar</option><option value="row">Menu on its own row</option></select>
  <button id="palbtn" title="Ctrl+Shift+P">⌘ Commands</button>
  <button id="help" title="What to try">?</button>
</div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k)); return e; };

// ---------------------------------------------------------------- the benches (stage 1)
const SWATCH = ['linear-gradient(135deg,#2c5364,#203a43)', 'linear-gradient(135deg,#7f5a83,#0d324d)', 'linear-gradient(135deg,#f6d365,#fda085)', 'linear-gradient(135deg,#5ee7df,#b490ca)', 'linear-gradient(135deg,#355c3a,#a8c66c)', 'linear-gradient(135deg,#232526,#414345)', 'linear-gradient(135deg,#ee9ca7,#ffdde1)', 'linear-gradient(135deg,#43cea2,#185a9d)', 'linear-gradient(135deg,#c79081,#dfa579)', 'linear-gradient(135deg,#4b6cb7,#182848)', 'linear-gradient(135deg,#ffafbd,#ffc3a0)', 'linear-gradient(135deg,#0f2027,#2c5364)'];
const rows = (list) => list.map(([t, m, cls]) => el('div', { class: 'row ' + (cls || '') }, t, m ? el('span', { class: 'm' }, m) : null));
let direction = 'auto';
const DENSITY = { code: 'dirB' }; // every other bench: roomy (dirC)

  Tools: () => [{ t: 'Settings', k: 'Ctrl+,' }, { t: 'Benches… (install, update, turn off)' }, { t: 'Command palette…', k: 'Ctrl+Shift+P', run: palette }, { t: 'Keyboard shortcuts…' }],
